# Check the data and run the tests on pull requests, before anything is published.
name: Test

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev,extract]'
      - run: python -m geosigma check
      - run: python -m pytest -q
