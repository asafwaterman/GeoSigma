# Publish the read-only web copy of the viewer on GitHub Pages after every push to main.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev,extract]'
      - run: python -m geosigma check
      - run: python -m pytest -q
      - run: python -m geosigma build
      - name: Fetch the map and chart libraries, so the site does not depend on a CDN
        run: |
          mkdir -p build/libs && cd build/libs
          npm pack --silent maplibre-gl@4.7.1 plotly.js-dist-min@2.35.2
          for f in *.tgz; do tar xzf "$f" && mv package "${f%.tgz}"; done
          cp maplibre-gl-4.7.1/dist/maplibre-gl.js maplibre-gl-4.7.1/dist/maplibre-gl.css plotly.js-dist-min-2.35.2/plotly.min.js .
      - run: python -m geosigma export-static build/static --libs build/libs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
