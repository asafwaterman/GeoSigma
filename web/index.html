<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GeoSigma</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.35.2/plotly.min.js"></script>
<script>window.Plotly || document.write('<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"><\/script>');</script>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>GeoSigma</h1>
  <span class="sub">Resistivity of Israel, from GSI survey reports</span>
  <label class="depth">Depth <input id="depth" type="range" min="0" max="3000" step="25" value="500">
    <output id="depthOut">500 m</output></label>
  <label class="sigma"><input type="checkbox" id="sigma"> <span class="wide-only">show conductivity </span>(σ)</label>
  <button id="openLeft" class="mobile-only">Legend &amp; surveys</button>
</header>
<main>
  <aside id="left">
    <button id="closeLeft" class="close mobile-only">Close</button>
    <h2>Legend</h2>
    <div id="legend"></div>
    <label class="areas"><input type="checkbox" id="showAreas" checked> Survey areas
      <small class="muted" id="areasHint">hover a rectangle to download its reports</small></label>
    <h2>Surveys</h2>
    <div id="surveys"></div>
  </aside>
  <div id="map"></div>
  <aside id="right">
    <div id="detailEmpty" class="muted">Click a site on the map to see its models and where they came from.</div>
    <div id="detail" hidden>
      <button id="closeDetail" class="close mobile-only">Close</button>
      <h2 id="siteTitle"></h2>
      <div id="siteMeta" class="muted"></div>
      <div id="siteNote" class="sitenote" hidden></div>
      <div id="profile" class="plot"></div>
      <div id="dsList"></div>
      <div id="prov"></div>
      <button id="showSection">Show the line section</button>
    </div>
  </aside>
</main>
<div id="sectionPane" hidden>
  <div class="bar"><b id="sectionTitle"></b><button id="closeSection">Close</button></div>
  <div id="section" class="plot"></div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
