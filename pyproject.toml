[project]
name = "geosigma"
version = "0.1.0"
description = "Unified geophysical resistivity database and viewer for Israel"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2", "pyyaml", "pyproj", "fastapi", "uvicorn", "pymupdf", "numpy",
]

[project.optional-dependencies]
extract = ["opencv-python-headless", "pytesseract"]
dev = ["pytest", "httpx"]

[tool.setuptools]
packages = ["geosigma", "geosigma.extract"]
