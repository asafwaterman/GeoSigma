id: rabinovich-1993-tdem-coastal-interface
name: Electromagnetic survey to locate the freshwater-seawater interface in the coastal aquifer
organisation: Institute for Petroleum Research and Geophysics (IPRG)
client: Hydrological Service, Water Commission
authors:
- B. Rabinovich
- M. Goldman
- M. Rabinovich
- A. Ronen
report_number: IPRG 735/296/92
year: 1993
acquired: '1993'
methods:
- TEM
region: Mediterranean coast (Ashqelon to Mikhmoret, and the Carmel coast) and the Tzukim springs on the Dead Sea
  shore
purpose: Depth to the low-resistivity layer(s) of the seawater interface in the coastal aquifer
geometry: stations
depth_reach: about 230 m (deepest layer boundary)
acquisition:
  instruments: Geonics EM-47 and EM-37 (PROTEM receiver)
  loops: 50 x 50 m to 200 x 200 m transmitter loops (printouts)
documents:
- id: main
  title: Electromagnetic survey to locate the interface in the coastal aquifer (in Hebrew, June 1993; tables and
    printouts in English)
  filename: Rabinovich-B-Electromagnetic-Survey-Locating-Seawater-Interface-Coastal-Aquifer-IPRG-Rep-735-296-92-1993.pdf
  drive_id: 1QHj_MDLd46O8vbC7OkM5nXKOnBXAaN-1
  language:
  - he
  - en
  scanned: true
  role: main_report
  sha256: 0a92dac0425c5d9d33fee7d066a1c153036a618cc1ae9079d3e0ba900284a14a
  pages: 78
notes: Table 2 (pages 7-8) gives each station's coordinates and the author's resistivity and depth of the first
  and second low-resistivity layers; the appendix (pages 12-77) prints the layered inversion of every sounding with
  its thickness, depth (elevation) and conductance. Both are stored, and the Table 2 values agree with the printouts
  at every station. HS291 and HS293 (Dead Sea) have two soundings each. Many printouts carry later handwritten notes
  (comparisons with older stations); the printed values are used and the handwriting is not. Table 3 (a reinterpretation
  of older EM-37 data) is not stored. Stations the author marks not reliable or erroneous are at confidence C, and
  those marked noisy at B.
extraction_status: complete
