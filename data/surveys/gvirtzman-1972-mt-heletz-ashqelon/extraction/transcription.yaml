# Table 1 "Results of magneto-telluric measurements at six stations in the Heletz-Ashqelon area", page 12 of
# GSI Bulletin 55 (1972), typed from the page at 200 dpi and checked on zoomed crops.
# Coordinates are Old Israel Grid metres as printed (104800/114270); positions agree with the Figure 2 location
# map (page 6) to within about 0.6 km.
# Interval is metres below ground. The deepest unit is open-ended: E is printed as "3,640 - > 11,600", i.e. its
# bottom was not reached, so it is stored as the half-space with the printed depth in the note.
# Each layer row: [top, bottom, rho (ohm.cm as printed), unit, {thick: printed thickness}]
document: main
unit: ohm.cm
method: MT
prefix: gvirtzman1972
confidence: A
table: Table 1 (results of magneto-telluric measurements)
crs: EPSG:28193
xy_scale: 1
site_word: MT station
accuracy_m: 100
prov_notes: Unit printed in the table header ("Resistivity, ohm-cm"). Checked against Table 2 (same page), whose
  per-unit ranges in ohm-cm (A 300-950, B 6,650-8,250, C 2,100-4,500, D 27-74, E 9,500-16,000, F 200-314,
  G 25,000-27,000) contain every value here, and against the text, which gives basement resistivities of
  18-46 x 10^3 ohm-cm. The 1971 report (page 31) prints the same table but labels station 38's third layer "E";
  the 1972 "F" is used because 200 ohm-cm lies in the F range, not the E range.
notes: Layer notes give the authors' magneto-telluric unit (A-G, Table 2). Last layer is the half-space.
