notes: The report prints no layered models. It gives the author's TDEM depths to four boundaries (top and base of
  the Hazeva Formation, base of the Avedat Group, top of the Arav Formation) in Table 2 (stations next to boreholes,
  pages 19-20) and Table 4 (other stations, pages 23-24); these are stored as interface depths. Where two concentric
  loops were measured, the author's joint solution is a separate dataset ("joint"). Table 3 gives per-unit resistivities
  without layer depths and is not stored. Values printed only as a lower bound (">") are not stored. The measurement
  date is not given (report dated January 1998).
