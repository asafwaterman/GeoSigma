notes: 'Main report appendix: 34 modified Schlumberger and monopole sounding sheets. The report says these soundings
  could in general not be interpreted (p. 26); only the 10 sheets that carry a two-layer CAL. RES. model are used,
  with their measured points. Left out as having no author model: the roving-dipole apparent-resistivity maps (Maps
  PDF, Figures 3-36, 34 transmitters, values with no depth), the 24 sheets without a model, the dipole-dipole pseudosections
  and the composite maps (Maps pages 37-42).'
