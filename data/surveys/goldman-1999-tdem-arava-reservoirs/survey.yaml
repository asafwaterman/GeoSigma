notes: The report prints no model tables. The author's layered and smooth (Occam) inversion models are plotted for
  each of the 12 stations in the appendix (pages 9-32) and were traced from those plots. The text (pages 4-5) gives
  the coordinates and the author's depths to the conductive layer, which the traced models match (Arava-1 about
  315 m; Hazeva-4, 6, 7 about 320-340 m; Hazeva-3, 5, 2 about 360-380 m; Hazeva and Hazeva-1 about 420 m layered
  and 450 m smooth). The author notes Zofar-2 lies near a high-voltage line and its data are distorted. The measurement
  date is not given.
