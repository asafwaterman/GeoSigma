notes: A drilling report, not a resistivity survey. Table 1 (page 6) lists five drillholes with the depth to syenite
  predicted by TDEM, the drilled depth and the depth where the contact was met (only holes 10 at 55 m and 7-A at 88
  m reached it). The TDEM models behind the predictions are in Goldman et al. 1990 (stations GS64-GS66), so no
  resistivity values are stored here. Pages 8-10 are gamma logs. Hole positions come from Table 1 where the location
  map (Fig. 1, page 5) agrees within about 150 m; for 7-A and 6 the table disagrees with the map (7-A is printed
  13740/99950, about 500 m north of its map position, and 6 is printed 13725/98880, 10 km south, evidently a typo for
  99880), so the map positions are used for those two.
