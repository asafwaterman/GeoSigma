notes: Stations HS403-HS462. Table 1 (pages 4-5) gives the coordinates and elevations, Table 2 (pages 6-7) the author's
  depths and resistivities of the upper and lower low-resistivity units, and the appendix (pages 9-38) the layered
  inversion printout of each interpreted station. The layered models were typed from the printouts; Table 2 depths
  are stored as separate interface depths and agree with the printouts to within rounding, except where the dataset
  notes say otherwise. Not stored as models are HS410, HS412, HS421 and HS446 (noisy, not interpreted), HS429 and
  HS430 (no printout; only their Table 2 depths are stored). The printout on page 30 under HS446 repeats HS445's
  model and is marked not interpreted, so it is not used. Stations the author marks as noisy are at confidence C.
