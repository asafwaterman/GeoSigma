notes: '81 VES sheets (main PDF pages 2-82), files 250 and 400 of job 625/68. Values on the sheets and maps are
  in ohm.cm and are stored in ohm.m. Figures PDF: location maps (1-5), sections and fence diagrams (6-19), and iso-resistivity
  maps at 50, 100 and 200 m depth and at 25 m below sea level (20-40, five sheets each; page 35 is blank). The maps
  (read by geosigma.extract.arava_maps) also cover soundings of files 224, 265-278, 806 and 844 that have no sheet
  here. Sections and fence diagrams (6-19) are not extracted; they redraw the same soundings.'
