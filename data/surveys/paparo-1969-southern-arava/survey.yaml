notes: '81 VES sheets (main PDF pages 2-82), files 250 and 400 of job 625/68. Values on the sheets and maps are
  in ohm.cm and are stored in ohm.m. Figures PDF: location maps (1-5), sections and fence diagrams (6-19), and iso-resistivity
  maps at 50, 100 and 200 m depth and at 25 m below sea level (20-40, five sheets each; page 35 is blank). Only
  the sheets'' CALC. RES. models are used. The iso-resistivity maps are not: their values follow the measured apparent-resistivity
  curve, not the models (e.g. 400-12: maps 2440 and 2810 ohm.cm at 50 and 100 m, curve about 2500 and 2900, model
  6200 and 640), so the 386 soundings known only from the maps (files 224, 265-278, 806, 807, 844) have no author
  model and are left out. Sections and fence diagrams (6-19) redraw the same soundings.'
