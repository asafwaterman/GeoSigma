notes: Six stations along a NW-SE profile. The results are given only as colour pseudo-2D cross-sections (Figs 2-3,
  layered and smooth inversions) with four colour classes and no numeric tables or per-station models, so no
  resistivity values are stored. The cross-sections show about 18 m of high-resistivity sediment over Dead Sea
  brine-saturated sediment (below 1 ohm.m) down to about 100 m. Station positions are read from the location map
  (Fig. 1, page 5), which shows the receiver coils in Old Israel Grid metres.
