id: goldman-1995-tdem-coastal-interface
name: Electromagnetic survey of the freshwater-seawater interface on the Mediterranean and Dead Sea coasts
organisation: Institute for Petroleum Research and Geophysics (IPRG)
client: Hydrological Service
authors:
- M. Goldman
report_number: IPRG L10/151/95
year: 1995
acquired: '1995'
methods:
- TEM
region: Mediterranean coast (Ashqelon to Hadera), the western Galilee coast (Shavei Zion to Rosh HaNikra), and the
  Tzukim (Ein Fashkha) springs on the Dead Sea shore
purpose: Depth to the low-resistivity unit(s) associated with seawater intrusion
geometry: stations
depth_reach: about 370 m (deepest layer boundary)
acquisition:
  instruments: Geonics PROTEM (printouts)
  loops: 25 x 25 m to 200 x 200 m transmitter loops (Table 1A)
documents:
- id: main
  title: Electromagnetic survey of the interface on the Mediterranean and Dead Sea coasts (in Hebrew, 1995; tables
    and printouts in English)
  filename: Goldman-M-Electromagnetic-Survey-Interface-Mediterranean-Dead-Seas-IPRG-Rep-L10-151-1995.pdf
  drive_id: 1PKV7pelDAm1sb4Pi9KoNBD8PJsz55bFz
  language:
  - he
  - en
  scanned: true
  role: main_report
  sha256: c8f01554df2e724747c661ab062c68734abc856a87b70468a6df513b6ec2ea37
  pages: 75
notes: Measured March-May 1995. Table 1A (pages 9-10) gives each station's coordinates and the author's resistivity
  and depth of the upper and lower low-resistivity units; Table 1B (page 11) lists the stations with no interface;
  the appendix (pages 16-73) prints the layered inversion of each station. Both the layered models and the Table
  1A depths are stored. The printouts were read by eye at 400 dpi (the scans are too poor for OCR alone) and every
  row was checked against its printed depth and conductance. Table 1A agrees with the printouts except at HS309
  and HS336 (noted on those datasets). HS342 (noisy, no coordinates) is not stored. Stations the author marks noisy
  or with a transmitter loop too small for the depth are at confidence B; HS347 (distorted) is at C. Tables 2-3
  (comparisons with older surveys and wells) are not stored.
extraction_status: complete
