id: goldman-1990-tdem-feasibility-stage-b
name: Applicability of the TDEM method to geological problems, stage B
organisation: Earth Sciences Administration; Oil Exploration (Investments) Ltd and Geological Survey of Israel
authors:
- M. Goldman
- A. Ronen
- Y. Bartov
- G. Steinitz
- G. Bar
report_number: ES-42-90 (IPRG 854/70/89, GSI/38/1990)
year: 1990
acquired: null
methods:
- TEM
region: Sedom and Amiaz (Dead Sea), Lod valley and Sharon, Makhtesh Ramon and Mitzpe Ramon, Paran, Timna and the
  southern Arava
purpose: Test whether TDEM resolves geological targets (salt, clay, aquifers, intrusions) next to boreholes
geometry: scattered
depth_reach: up to about 435 m (deepest layer boundary)
documents:
- id: main
  title: Applicability of the TDEM method to geological problems, stage B (in Hebrew, July 1990; appendices in English)
  filename: Goldman-M-Feasibility-Study-TDEM-Method-IPRG-854-70-89-GSI-38-1990.pdf
  drive_id: 1YLR3IcMaaGlF6lhbJRN0vA6SuxeK-N6e
  language:
  - he
  - en
  scanned: true
  role: main_report
  sha256: 13a431586229cb658ed2455b9b2375bc8e814de5943a027ef2837eaf33a832c4
  pages: 98
notes: The author's layered models are printed in Appendix 1 (pages 25-32) with each station's coordinates and target
  borehole; Appendix 2 (pages 34-95) plots the same soundings. Not stored are GS-16, 17, 18, 22 and 37-2 (noisy,
  no model), GS-39 (no coordinates printed), and GS-67 (Shen Ramon; its printed coordinates are identical to GS-54
  in the southern Arava, so its position is unknown). Stations the author marks as distorted or noisy are at confidence
  C. The measurement dates are not given.
